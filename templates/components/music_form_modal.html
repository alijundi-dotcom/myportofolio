<div id="add-music-modal" class="project-form-modal" popover="auto" role="dialog">
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-music-modal" popovertargetaction="hide">×</button>
        <h2>Tambah Musik Baru</h2>
        
        <!-- PENTING: id Harus 'music-form' -->
        <form id="music-form" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-music-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Musik</button>
            </div>
        </form>
    </div>
</div>
