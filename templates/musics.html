{% extends "base.html" %}

{% block meta %}
    <title>Daftar Musik</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <h1>Daftar Musik</h1>

            <!-- Tombol Tambah Musik -->
            <button type="button" class="button" popovertarget="add-music-modal">
                + Tambah Musik
            </button>

            <!-- Grid Wadah Musik -->
            <div id="music-grid" class="experience-grid project-grid" style="margin-top: 20px;"></div>
        </div>
    </section>
</main>

<!-- INCLUDE MODAL SEBELUM SCRIPT KODE JS -->
{% include "components/music_form_modal.html" %}

<script>
    const DELETE_MUSIC_ENDPOINT = "{% url 'main:delete_music_ajax' '00000000-0000-0000-0000-000000000000' %}";
    const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
    const GET_MUSIC_ENDPOINT = "{% url 'main:show_json_music' %}";
    const CREATE_MUSIC_ENDPOINT = "{% url 'main:create_music_ajax' %}";

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function fetchMusics() {
        const gridContainer = document.getElementById('music-grid');
        if (!gridContainer) return;
        try {
            const response = await fetch(GET_MUSIC_ENDPOINT);
            if (!response.ok) return;
            const data = await response.json();

            gridContainer.innerHTML = '';
            if (data.length === 0) {
                gridContainer.innerHTML = '<p>Belum ada musik.</p>';
                return;
            }

            data.forEach(item => {
                const music = item.fields ? item.fields : item;
                const musicId = item.pk || music.id || item.id;

                const card = document.createElement('article');
                card.className = 'experience-card';

                
                const titleEscaped = escapeHtml(music.title || '');
                const categoryEscaped = escapeHtml(music.category || 'MUSIC');
                const descriptionEscaped = escapeHtml(music.description || '');
                const thumbnailEscaped = escapeHtml(music.thumbnail || '');
                const linkHtml = thumbnailEscaped 
                    ? `<a href="${thumbnailEscaped}" target="_blank" class="button">Dengar Musik</a>`
                    : '';

                const deleteUrl = "{% url 'main:delete_music_ajax' '00000000-0000-0000-0000-000000000000' %}"
                    .replace('00000000-0000-0000-0000-000000000000', musicId);

                const deleteHtml = IS_SUPERUSER 
                    ? `<button type="button" class="button button-danger" onclick="deleteMusic('${musicId}')">Hapus</button>`
                    : '';
                    

                card.innerHTML = `
                    <h2>${escapeHtml(music.title)}</h2>
                    <span class="experience-category">${escapeHtml(music.category || 'Music')}</span>
                    <p class="experience-description">${escapeHtml(music.description || '')}</p>
                    <div class="project-card-actions" style="margin-top: 15px;">
                        <div class="project-actions" style="display: flex; gap: 10px; align-items: center;">
                            ${linkHtml}
                            ${deleteHtml}
                        </div>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        } catch (err) {
            console.error('Error fetching musics:', err);
        }
    }
    async function deleteMusic(musicId) {
        if (!confirm('Apakah kamu yakin ingin menghapus musik ini?')) return;

        // Ganti dummy ID dengan ID musik yang sebenarnya
        const deleteUrl = DELETE_MUSIC_ENDPOINT.replace('00000000-0000-0000-0000-000000000000', musicId);

        try {
            const response = await fetch(deleteUrl, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken'),
                },
            });

            const result = await response.json().catch(() => ({}));

            if (response.ok) {
                if (typeof showToast == 'function') {
                    showToast('Berhasil', result.message || 'Musik berhasil dihapus!', 'success');
                }
                fetchMusics(); // Refresh grid musik setelah berhasil dihapus
            } else {
                if (typeof showToast === 'function') {
                    showToast('Gagal', result.message || 'Gagal menghapus musik.', 'error');
                }
            }
        } catch (error) {
            console.error('Error deleting music:', error);
            if(typeof showToast == 'function'){
                showToast('Error', 'Tidak dapat terhubung ke server.', 'error');
            }
        }
    }

    function closeMusicModal() {
        const modal = document.getElementById("add-music-modal");
        if (modal && typeof modal.hidePopover === 'function') {
            modal.hidePopover();
        }
    }

    // FUNGSI UTAMA AJAX SUBMIT (Sama seperti addProject di projects.html)
    async function addMusic(event) {
        event.preventDefault(); // Mencegah reload halaman standar!

        const musicForm = document.getElementById('music-form');
        if (!musicForm) return;

        const submitButton = musicForm.querySelector('button[type="submit"]');
        if (submitButton) submitButton.disabled = true;

        try {
            const response = await fetch(CREATE_MUSIC_ENDPOINT, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: new FormData(musicForm),
            });

            const result = await response.json().catch(() => ({}));

            if (response.ok) {
                musicForm.reset();
                closeMusicModal();
                fetchMusics();
                showToast('Berhasil', result.message || 'Musik baru berhasil ditambahkan!', 'success');

            } else {
                let errorMessage = 'Gagal menambahkan musik.';
                if (result.errors) {
                    const messages = Object.values(result.errors).flat().map(err => err.message || err);
                    errorMessage = messages.join(' ');
                } else if (result.message) {
                    errorMessage = result.message;
                }
                if (typeof showToast === 'function') {
                    showToast('Gagal', errorMessage, 'error');
                }
            }
        } catch (error) {
            console.error('Error adding music:', error);
            if(typeof showToast == 'function'){
                showToast('Error', 'Tidak dapat terhubung ke server. Silakan coba lagi.', 'error');
            }
        } finally {
            if (submitButton) submitButton.disabled = false;
        }
    }

    // Pasang Event Listener saat DOM Siap
    document.addEventListener('DOMContentLoaded', () => {
        const musicForm = document.getElementById('music-form');
        if (musicForm) {
            musicForm.addEventListener('submit', addMusic);
        } else {
            console.error("Form dengan id 'music-form' tidak ditemukan!");
        }
        
        fetchMusics();
    });
</script>
{% endblock content %}
